name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build Jekyll site
        run: |
          bundle install
          bundle exec jekyll build --source src-content --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Fix markdown links to directory URLs
        run: |
          find _site -name "*.html" -type f -exec sed -i 's|\.md"|/"|g' {} +
          find _site -name "*.html" -type f -exec sed -i "s|\.md'|/'|g" {} +

      - name: Add external link arrow markers
        run: |
          # Add ↗ prefix to external links (http/https) - handle double quotes
          find _site -name "*.html" -type f -exec sed -i -E 's|<a href="(https?://[^"]*)">([^<]*)</a>|<a href="\1">↗ \2</a>|g' {} +
          # Handle single quotes
          find _site -name "*.html" -type f -exec sed -i -E "s|<a href='(https?://[^']*)'>([^<]*)</a>|<a href='\1'>↗ \2</a>|g" {} +
          # Handle links with other attributes (target, rel, etc.) - double quotes
          find _site -name "*.html" -type f -exec sed -i -E 's|<a ([^>]*href="(https?://[^"]*)"[^>]*)>([^<]*)</a>|<a \1>↗ \3</a>|g' {} +
          # Handle links with other attributes - single quotes
          find _site -name "*.html" -type f -exec sed -i -E "s|<a ([^>]*href='(https?://[^']*)'[^>]*)>([^<]*)</a>|<a \1>↗ \3</a>|g" {} +

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
