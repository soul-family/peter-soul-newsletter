name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Prepare source
        run: |
          rm -rf _site_build
          mkdir -p _site_build
          cp -r SRC_CONTENT/. _site_build/
          cp -r _dev/site-generation/source/. _site_build/

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        run: |
          bundle install
          bundle exec jekyll build --source _site_build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Post-process HTML
        run: |
          find _site -name "*.html" -type f -print0 | xargs -0 sed -i 's|\.md"|/"|g; s|\.md'"'"'|/'"'"'|g'
          find _site -name "*.html" -type f -print0 | xargs -0 perl -pi -e 's/<a href="(https?:[^"]*)"(?![^>]*target)/<a href="$1" target="_blank" rel="noopener noreferrer"/g'
          find _site -name "*.html" -type f -print0 | xargs -0 perl -pi -e "s/<a href='(https?:[^']*)'(?![^>]*target)/<a href='\''$1'\'' target=\"_blank\" rel=\"noopener noreferrer\"/g"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4