<meta charset="utf-8" />
<title>
  {{ page.title }}
  {% if page.date %}
    {% assign date_parts = page.date | split: '/' %}
    {% assign year = date_parts[0] %}
    {% assign month = date_parts[1] %}
    {% capture month_name %}{% include month_name.html month=month %}{% endcapture %}
    - {{ month_name }} {{ year }}
  {% endif %}
  - {{ site.title }}
</title>
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />
